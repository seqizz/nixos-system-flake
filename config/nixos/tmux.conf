# Key bindings overview
#
# Alt -             : divide window horizontal
# Alt |             : divide vertical
# Alt [wasd]        : extend the active pane to the selected side
# Alt [arrow]       : switch to the pane on the selected side
# Alt Shift [arrow] : switch to the window on the selected side
# Alt z             : toggle zoom on the active pane
# Alt r             : reload configuration
# Alt b             : move (a.k.a. break) pane to its own window
# Alt [123...]      : switch to the Nth window
# Alt L             : list window selection
# Alt M             : toogle mouse mode
# Alt o             : record pane output to ~/tmux-record.*
# Alt Esc           : toggle copy mode
# [copy] Enter/Esc  : quit copy mode
# [copy] /          : search

# Use vi bindings
set-window-option -g mode-keys vi

# split panes using | and -
# bind | split-window -h
# bind - split-window -v
bind-key -n M-| split-window -h
bind-key -n M-- split-window -v
unbind '"'
unbind %
unbind !

# Be explicit because of Mosh
bind-key -n End send-keys "\e[F"
bind-key -n Home send-keys "\e[H"

# Record pane output to a file, it'll put everything you see on screen
# The #I and #P are for window/pane index, so the file created is unique
bind-key -n M-o run "\
    tmux pipe-pane -o 'cat >>~/tmux-record.#I-#P';\
    tmux display-message 'recording to ~/tmux-record.#I-#P';\
"

# Conflicting with my double-escape zsh sudo
unbind Escape
set -sg escape-time 0

# Shortcut for killing a window quickly is alt-k
bind-key -n M-k confirm-before -p "kill-window #W? (y/n)" kill-window

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Longer scrollback
set -g history-limit 30000

# reload config
bind-key -n M-r source-file /etc/tmux.conf

# Move a pane to its own window
bind-key -n M-b break-pane

# Pane resizing
bind-key -n M-w resize-pane -U 2
bind-key -n M-a resize-pane -L 2
bind-key -n M-s resize-pane -D 2
bind-key -n M-d resize-pane -R 2

#new window with n
bind -n M-n new-window

# switch windows alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Ctrl-(Shift)-tab to switch between windows
# (For some reason Crtl-Shit-Tab is not working so I pass octal values)
set -s user-keys[0] "\033\133\061\073\065\132"
bind-key -n C-Tab next-window
bind-key -n User0 previous-window

# Always has the correct window numbers
set-option -g renumber-windows on

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

#Zoom pane with alt-Z
bind-key -n M-z resize-pane -Z

# Choose session with alt-L
bind-key -n M-l choose-tree

# New session, and ask for its name
bind-key -n M-N command-prompt "new-session -s '%%'"

#For shift pageup-down
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# Switch to copy mode
unbind [
bind -n M-Escape copy-mode
bind-key -T copy-mode-vi M-Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi Enter send-keys -X cancel

# Send USR1 to the active app
bind-key -n M-U run-shell 'kill -s USR1 -- "-$(ps -o tpgid:1= -p #{pane_pid})"'

# Yank to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'oscyank'

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse off

# Toggle mouse mode with Alt-M
bind -n M-m run "\
    tmux show-options -g mouse | grep -q on ; \
    if [ \$? = 0 ]; then  \
        toggle=off;  \
    else  \
        toggle=on;  \
    fi;  \
    tmux display-message \"mouse is now: \$toggle\";  \
    tmux set-option -wg mouse ; \
    "

# don't rename windows automatically
set-option -g allow-rename off

#For ctrl arrow shit skip word etc
set-window-option -g xterm-keys on

######################
### DESIGN CHANGES ###
######################

# panes
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightred

## Status bar design
# status line
set -g status-justify left
set -g status-interval 2

# messaging
set -g message-style fg=black,bg=yellow
# set -g message-bg yellow
set -g message-command-style fg=blue,bg=black
# set -g message-command-bg black

#window mode
setw -g mode-style bg=colour6,fg=colour0
# setw -g mode-style fg=colour0
# setw -g mode-fg colour0

#title
set-option -g set-titles on
set -g set-titles-string "#h:#S:#{pane_title} #{session_alerts}"

# Info on left (I don't have a session display for now)
set -g status-left ''

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# The modes {
setw -g clock-mode-colour colour135
setw -g mode-style bold
setw -g mode-style fg=colour196,bg=colour238
# setw -g mode-bg colour238

# }
# The panes {

set -g pane-border-style bg=colour235,fg=colour238
# set -g pane-border-fg colour238
set -g pane-active-border-style bg=colour236,fg=colour51
# set -g pane-active-border-fg colour51

#set inactive/active window styles
set -g window-style fg=colour247
set -g window-active-style fg=colour230

# }
# The statusbar {

set -g status-position bottom
set -g status-style bg=default,fg=colour12,bg=colour234,fg=colour137,dim
set -g status-left ''
set -g status-right '#(exec tmux list-sessions | sed "s/ windows.*//" | tr "\\n" " ") #[fg=colour233,bg=colour237,bold]#{battery_status_bg} #{battery_icon}#{battery_percentage} #[fg=colour233,bg=colour241,bold] %H:%M #[fg=colour233,bg=colour245,bold] #H '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style bold,fg=colour255,bg=colour1

# }
# The messages {

set -g message-style bold,fg=colour232,bg=colour166

# }

# True color
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g automatic-rename 1
set -g automatic-rename-format " #{=30:pane_title} "

# Extrakto options
set -g @extrakto_split_direction v
set -g @extrakto_clip_tool "oscyank"
set -g @extrakto_clip_tool_run "fg"

# Plugins are loaded by programs.tmux.plugins in tmux.nix, after this file
